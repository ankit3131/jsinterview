    <script>
  
function ransom(ransomNote, magazine) {

    magazine = magazine.split("");

    for (let i = 0; i < ransomNote.length; i++) {

        let found = false;

        for (let j = 0; j < magazine.length; j++) {

            if (ransomNote[i] === magazine[j]) {
                debugger;
                magazine[j] = "#"; // mark as used
                found = true;
                break;
            }
        }

        if (!found) {
            debugger;
            return false;
        }
    }

    return true;
}

    </script>
