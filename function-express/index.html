    <script>
  

function longestString(str, k) {
    let maxLength = 0;

    for (let i = 0; i < str.length; i++) {
 debugger;
        let countA = 0;
        let countB = 0;

        for (let j = i; j < str.length; j++) {
            debugger;

            if (str[j] === "A") {
                countA++;
            } else {
                countB++;
            }

            let windowLength = j - i + 1;
            let maxFreq = Math.max(countA, countB);
            let replace = windowLength - maxFreq;

            console.log(
                "Window:", str.slice(i, j + 1),
                "| A:", countA,
                "| B:", countB,
                "| Length:", windowLength,
                "| Replace:", replace
            );

            if (replace <= k) {
                maxLength = Math.max(maxLength, windowLength);
            }
        }
    }

    return maxLength;
}

let str = "AABABAB";
let k = 2;

console.log("Answer =", longestString(str, k));
